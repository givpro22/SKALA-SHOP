# 배포 서버용 compose. CI 가 이 파일을 서버로 보내고 docker-compose.yml 로 놓는다.
#
# 루트의 docker-compose.yml 과의 차이는 하나뿐이다 — build 대신 image.
# 서버에서는 소스를 받지 않고 GHCR 에 이미 올라간 이미지를 pull 만 한다.
# (같은 파일에 build 와 image 를 같이 두지 않은 이유: 서버에 소스가 없으므로
#  compose 가 build context 를 찾다 실패한다. 로컬 개발 파일과 역할이 다르다.)
services:

  mysql:
    image: mysql:8.0
    container_name: skala-shop-mysql
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skalashop}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    # IMAGE_TAG 는 CI 가 커밋 SHA 로 채운다. latest 로 띄우면 서버에 어떤 커밋이
    # 돌고 있는지 이미지만 봐서는 알 수 없고, 롤백할 방법도 없다.
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG:-latest}
    container_name: skala-shop-backend
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-skalashop}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # 기본값을 주지 않는다. 비면 ProdEnvironmentGuard 가 기동을 실패시킨다 —
      # application.yml 의 개발용 기본값으로 뜨면 토큰 위조가 가능한 배포본이 된다.
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      # ADMIN 부트스트랩 자격증명 (계약 §9.4.5). 기본값을 주지 않는다.
      #
      # JWT_SECRET 과 달리 `:?required` 를 쓰지 않는다 — 계약은 이 값을 **ADMIN 0건일 때만**
      # 필수로 규정한다. 여기서 하드 요구하면 이미 ADMIN 이 있는 서버가 변수 하나 없다는
      # 이유로 재배포에서 기동조차 못 한다. 빈 값으로 넘기고 판정은 AdminBootstrapRunner 가 한다.
      #
      # 값이 없고 ADMIN 도 0건이면 러너가 IllegalStateException 으로 기동을 끊는다.
      # 그 실패는 **헬스체크가 아니라 종료 코드로만** 보인다 — restart 정책 관련 주의는 아래 참조.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/products"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 루트 compose 와 같은 이유로 on-failure:5 다(실측 근거는 그쪽 주석과 배포 노트 §라운드 17).
    # 요지: AdminBootstrapRunner 실패는 Tomcat 이 뜬 뒤에 나므로 **101ms 동안 API 가 산다.**
    # unless-stopped 면 그 창이 ~9초마다 영원히 다시 열려, 밖에서 curl 하는 배포 검증이
    # 운 좋게 200 을 받고 초록으로 끝난다. on-failure:5 는 exited(1) 로 상태를 확정시킨다.
    restart: on-failure:5

  frontend:
    # VITE_API_BASE_URL 은 이 이미지 안에 이미 구워져 있다(빌드 시점 인라인).
    # 배포 주소를 바꾸려면 여기 환경변수를 고치는 게 아니라 이미지를 다시 빌드해야 한다.
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    container_name: skala-shop-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  mysql-data:
