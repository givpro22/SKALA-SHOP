spring:
  application:
    name: skala-shop

  profiles:
    # 명시적으로 --spring.profiles.active를 주지 않으면 local로 뜬다.
    # prod는 컨테이너 기동 시 SPRING_PROFILES_ACTIVE=prod로 덮어쓴다.
    active: local

  jpa:
    # 기본값(true)은 요청이 끝날 때까지 영속성 컨텍스트를 열어두어, Controller·직렬화 단계에서
    # 의도치 않은 지연 로딩 쿼리가 나간다. 끄면 그 문제가 개발 중 예외로 즉시 드러난다.
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    # java.util.Date 계열용. LocalDateTime 포맷은 shop.config.JacksonConfig가 고정한다.
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Seoul

  mvc:
    # 매핑되지 않은 경로에서 예외가 올라오게 한다.
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # 계약은 이 값을 규정하지 않는다(구현 재량). false를 택한 이유:
      #  - 이 서비스는 API 전용이라 정적 리소스 서빙이 필요 없다.
      #  - 기본값(true)이면 ResourceHttpRequestHandler가 /**를 먼저 받아, 계약 §5가 첫 번째로
      #    지목한 NoHandlerFoundException이 한 번도 발생하지 않는다. 문서에 적힌 예외와 실제로
      #    던져지는 예외가 어긋나 있으면 다음 사람이 잘못된 핸들러를 단다.
      # 실측: true -> NoResourceFoundException / false -> NoHandlerFoundException.
      # Swagger UI는 두 값에서 동일하게 동작한다(springdoc이 /swagger-ui/** 핸들러를 직접 등록).
      add-mappings: false

  # 값이 무엇이든 #7 전역 핸들러는 NoHandlerFoundException과 NoResourceFoundException을
  # 모두 ENDPOINT_NOT_FOUND로 처리한다. 하나만 잡으면 설정이 바뀌는 순간 404 대신 500이 나간다.

# API 계약 §0 CORS. 프로파일별로 덮어쓸 수 있게 공통 기본값만 둔다.
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ---------------------------------------------------------------- JWT
#
# 비밀키를 하드코딩하지 않는다. 값이 이미지에 박히면 배포본에서 토큰 위조가 가능해진다.
# local 기본값은 개발 편의용이며, prod 는 반드시 환경변수로 주입한다(ProdEnvironmentGuard 가 확인).
jwt:
  secret: ${JWT_SECRET:skala-shop-local-dev-secret-key-please-change-in-prod}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

# ---------------------------------------------------------------- Actuator
#
# **프로파일별로 나누지 않고 공통에 둔다.** Swagger 와 반대다 — Swagger 는 prod 에서 끄지만
# health 는 컨테이너 오케스트레이터가 읽는 값이라 끄면 배포가 스스로를 확인할 수 없다.
# 노출 범위가 local 과 prod 에서 같아야 "로컬에서 검증한 경계"가 배포본의 경계와 같다고 말할 수 있다.
#
# 엔드포인트가 열리는지는 **독립된 두 스위치**가 정한다. 아래 include 는 "존재하는가"만 정하고,
# "누가 닿는가"는 SecurityConfig 의 EndpointRequest 매처가 정한다. 한쪽만 보고 통과로 읽으면
#  - 노출만 하고 인가를 빼면 → metrics/loggers 가 익명에게 열린다 (화면상 아무 증상이 없다)
#  - 인가만 걸고 노출을 빼면 → 404 가 나오는데 이건 차단이 아니라 **부재**다
# 그래서 판정은 다섯 번의 호출로 한다(02_backend_impl-log.md).
management:
  endpoints:
    web:
      exposure:
        # 화이트리스트다. `"*"` 를 쓰지 않는다 — 부트 버전이 올라가며 엔드포인트가 늘면
        # 검토한 적 없는 것이 자동으로 열린다.
        #
        # env·configprops 를 뺀 이유: 그 둘은 DB_PASSWORD·JWT_SECRET 이 들어 있는 화면이고,
        # 마스킹은 설정 기본값에 기대는 방어다. 배포 주소가 보고서에 인쇄돼 있는 이상
        # **노출하지 않는 것이 마스킹보다 확실하다.** heapdump·threaddump 도 같은 이유다 —
        # 힙 덤프에는 마스킹이라는 개념 자체가 없다(평문 비밀키가 그대로 들어 있다).
        include: health,info,metrics,loggers
  endpoint:
    health:
      # 기본값(never)이면 UP/DOWN 만 나온다. always 로 두면 DB 접속 상태·디스크 여유가
      # 익명에게 나간다. when-authorized 는 익명에게 status 만, ADMIN 에게 상세를 준다 —
      # 헬스체크(익명)와 운영 진단(ADMIN)이 같은 URL 을 쓰면서 보는 것이 다르다.
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: false   # info 에 환경변수를 실어 보내지 않는다
