spring:
  datasource:
    # 비밀값을 이미지에 굽지 않는다. docker-compose가 환경변수로 주입한다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # 빈 MySQL로 처음 기동하는 배포에서 validate는 테이블이 없어 실패한다.
      # 기본은 update로 두고, 스키마가 고정된 환경에서는 DDL_AUTO=validate로 조일 수 있게 한다.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# 배포 환경에 API 구조 전체를 익명으로 노출할 이유가 없다. 캡처는 local에서 찍는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    shop: INFO
