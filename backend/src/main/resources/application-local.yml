spring:
  datasource:
    url: jdbc:h2:mem:skalashop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 매 기동마다 스키마를 새로 만든다. 도메인 스펙 §6 시드가 항상 같은 상태로 재구성되는 근거다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

logging:
  level:
    shop: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
