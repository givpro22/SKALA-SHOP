services:

  mysql:
    image: mysql:8.0
    container_name: skala-shop-mysql
    environment:
      # backend와 로그 시각을 맞춘다. 앱이 LocalDateTime을 쓰고 MySQL 시간 함수를 쓰지 않아
      # 데이터 의미에는 영향이 없지만, 장애를 추적할 때 두 컨테이너 로그가 9시간 어긋나 있으면
      # 같은 사건을 시간순으로 잇기 어렵다.
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-skalashop}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skalashop}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # named volume이 없으면 `docker compose down`에 데이터가 증발한다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # backend가 이 조건을 기다린다. depends_on만으로는 컨테이너 "시작"만 보장되고
      # MySQL이 접속을 받을 준비가 됐는지는 보장되지 않아 backend가 커넥션 실패로 죽는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-skalashop}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: skala-shop-backend
    environment:
      # LocalDateTime.now()는 JVM 기본 타임존을 따르는데, 컨테이너에 TZ가 없으면 UTC로 뜬다.
      # 그러면 createdAt·orderedAt·canceledAt이 전부 9시간 과거의 벽시계로 저장된다.
      # application.yml의 spring.jackson.time-zone은 이걸 막지 못한다 —
      # 그 설정은 java.util.Date 계열 전용이라 LocalDateTime에는 영향이 없다.
      # 계약 §0이 날짜를 오프셋 없는 형식으로 못 박아서 클라이언트가 보정할 수도 없다.
      # -Duser.timezone 대신 TZ를 쓰는 이유는 컨테이너 로그 타임스탬프까지 함께 맞추기 때문이다.
      TZ: Asia/Seoul
      # 이걸 빼면 컨테이너가 H2 인메모리로 뜬다. 겉보기엔 정상 동작하므로
      # 재기동마다 데이터가 사라지는 것을 늦게 발견한다.
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 사이에서는 서비스명이 DNS 이름이다. localhost가 아니다.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-skalashop}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-skalashop}
      DDL_AUTO: ${DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # JWT 서명키. **기본값을 주지 않는다.**
      #
      # application.yml 에는 개발용 기본값이 있어 이 변수를 안 넘기면 컨테이너가 그 값으로
      # 그냥 뜬다 — 소스를 본 사람이면 누구나 토큰을 위조할 수 있는 배포본이 된다.
      # 여기서 빈 값으로 넘겨 기본값을 덮고, ProdEnvironmentGuard 가 기동을 실패시킨다.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      # ADMIN 부트스트랩 자격증명 (계약 §9.4.5). **기본값을 주지 않는다** — JWT_SECRET 과 같은 취급이다.
      #
      # 시드는 @Profile("local") 이라 prod 에는 ADMIN 을 만드는 경로가 없었다. 그래서
      # 깨끗한 배포는 카탈로그를 채울 수 없는 채로 뜬다 — 기동·헬스체크·조회 API 가 전부
      # 정상이라 **설정이 틀렸다는 신호가 어디에도 없는** 종류의 실패다.
      #
      # `:?required` 로 강제하지 않는 이유: 계약 §9.4.5 는 이 값을 **ADMIN 0건일 때만** 필수로
      # 규정한다. compose 에서 하드 요구하면 이미 ADMIN 이 있는 정상 배포도 변수가 없다는
      # 이유로 기동이 막혀 계약보다 엄격해진다. 빈 값으로 넘기고 **판정은 앱이 한다**
      # (AdminBootstrapRunner: 0건인데 비어 있으면 기동 실패, 1건 이상이면 무시).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # **`GET /api/products` 를 읽는다.** `/actuator/health` 는 78fd159 로 들어와 있고 익명 공개라
      # 쓸 수 있다 — 쓸 게 없어서가 아니라 **안 쓰기로 정했다.**
      #
      # 두 경로가 확인하는 범위가 다르다. health 는 DataSource 커넥션 검증까지고(DB 가 죽으면
      # 집계 status 가 DOWN 이 되므로 그건 이쪽도 잡는다), `/api/products` 는 시큐리티 필터 체인 →
      # 컨트롤러 → JPA → 직렬화까지 **응답이 나오는 것**을 확인한다. 필터 체인이 공개 조회를
      # 막거나 매핑·직렬화가 깨진 상태는 health 가 UP 인 채로 통과한다.
      # 반대 방향도 있다 — health 의 diskSpace 지표는 트래픽을 정상으로 받는 상태에서도 DOWN 이
      # 될 수 있고, 그러면 `depends_on: service_healthy` 로 묶인 frontend 까지 함께 막힌다.
      #
      # 비용은 문제가 되지 않는다. 20행 조회를 10초에 한 번 친다.
      # 대가는 이 경로가 `GET /api/**` permitAll 에 **의존한다**는 것이다 — 인증 경계를 좁히면
      # 여기가 401 로 조용히 깨진다. 그 경우가 전환을 다시 볼 시점이다
      # (판단 근거와 전환 시 확인 절차: `_workspace/05_devops_deploy-notes.md` §헬스체크 경로 판단).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/products"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # unless-stopped 가 아니라 on-failure:5 다. **설정 오류에는 무한 재시작이 해롭다.**
    #
    # AdminBootstrapRunner 의 판정은 DB 를 읽어야 해서 러너 단계에 있고, 그때는 Tomcat 이 이미 떠 있다.
    # 실측(자격증명 없이 기동): Started 23:25:00.011 -> run failed 23:25:00.112 — **101ms 동안 API 가 산다.**
    # unless-stopped 면 이 창이 ~9초마다 **영원히** 다시 열려서, 60초에 5436회 폴링했더니 200 이 2회 나왔다.
    # 그동안 health 는 healthy 가 되지 못하고 계속 starting 에 머문다(start_period 30s 가 지나기 전에
    # 재시작하므로 retries 가 쌓이지 않는다). 즉 `docker compose ps` 는 "이제 막 뜨는 중"처럼 보이고,
    # 밖에서 curl 하는 쪽은 운 좋으면 200 을 받는다 — **고장난 배포가 정상으로 보인다.**
    #
    # on-failure:5 면 다섯 번 뒤 컨테이너가 exited(1) 로 **멈춰서** 상태가 확정된다.
    # 일시적 실패(DB 순단)에는 여전히 5회 재시도가 남고, 영구적 설정 오류는 되풀이되지 않는다.
    # 종료 코드로 판정하라는 계약 §9.4.5 의 요구가 정책으로 성립하려면 멈추는 상태가 있어야 한다.
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        # 브라우저가 접근하는 주소다. 브라우저는 호스트에서 돌기 때문에
        # http://backend:8080(컨테이너 내부 DNS)을 쓰면 해석하지 못한다.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: skala-shop-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  mysql-data:
